name: Error tracking smoke

on:
    pull_request:
    merge_group:
        types: [checks_requested]
    push:
        branches: [main]
    workflow_dispatch:

permissions: {}

concurrency:
    group: error-tracking-harness-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    affected:
        permissions:
            contents: read
        uses: ./.github/workflows/check-affected.yml
        with:
            package-name: '@posthog/plugin-utils'
            additional-paths: |
                packages/webpack-plugin/
                packages/rollup-plugin/
                packages/nextjs-config/
                packages/nuxt/src/
                packages/core/src/error-tracking/
                packages/node/src/extensions/error-tracking/
                packages/browser/src/posthog-exceptions.ts
                packages/browser/src/extensions/exception-autocapture/
                packages/browser/src/entrypoints/exception-autocapture.ts
                tooling/error-tracking-harness/
                pnpm-workspace.yaml
                .github/workflows/error-tracking-harness.yml

    pack:
        name: Pack PR-built subject tarballs
        needs: affected
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.affected.outputs.is-affected != 'false') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
              with:
                  build: false
            - name: Pack direct and transitive dependencies
              run: tooling/error-tracking-harness/pack.sh "$RUNNER_TEMP/error-tracking-subject"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: error-tracking-subject
                  path: ${{ runner.temp }}/error-tracking-subject/
                  retention-days: 1
                  if-no-files-found: error

    smoke:
        name: Smoke test packed plugins
        needs: pack
        if: ${{ !cancelled() && needs.pack.result == 'success' }}
        permissions:
            actions: read
            contents: read
        uses: PostHog/error-tracking-harness/.github/workflows/subject-smoke.yml@65ee6a4c625cfa431d422d35c77ffba20111cd5b
        with:
            subject-artifact: error-tracking-subject
            # Build the same pinned harness revision without publishing an image.
            harness-source-ref: 65ee6a4c625cfa431d422d35c77ffba20111cd5b
