name: Node SDK benchmark report

on:
    workflow_run:
        workflows: ['Node SDK benchmarks']
        types: [completed]

permissions: {}

jobs:
    report:
        permissions:
            contents: read
            actions: read
            pull-requests: write
        uses: PostHog/.github/.github/workflows/sdk-benchmark-report.yml@7eec66436a29a83ec39e7416937c2b66d4e31e2a # SDK benchmark workflow (PostHog/.github PR #84)
        with:
            workflow-path: .github/workflows/node-benchmarks.yml
            artifact-name: node-benchmark-results
            report-key: posthog-node
            sdk: posthog-node
