name: Node SDK benchmark report

on:
    workflow_run:
        workflows: ['Node SDK benchmarks']
        types: [completed]

permissions: {}

jobs:
    report:
        permissions:
            contents: read
            actions: read
            pull-requests: write
        uses: PostHog/.github/.github/workflows/sdk-benchmark-report.yml@3322f26f21f088ad5e5960d65a916971e309ac0b # SDK benchmark workflow (PostHog/.github PR #84)
        with:
            workflow-path: .github/workflows/node-benchmarks.yml
            artifact-name: node-benchmark-results
            report-key: posthog-node
            sdk: posthog-node
