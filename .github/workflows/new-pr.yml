name: New PR

on:
    pull_request:
        types: [opened, edited, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    check-description:
        name: Check that PR has description
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Audit runner egress
              uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
              with:
                egress-policy: audit

            - name: Check if PR is shame-worthy
              id: is-shame-worthy
              run: |
                  FILTERED_BODY=$( \
                      sed -r -e \
                      '/^[[:space:]]*(\.\.\.|##?[[:space:]]|-[[:space:]]*\[)/d' \
                      <<< "$RAW_BODY" \
                  )
                  echo "::debug::Filtered PR body to $FILTERED_BODY"
                  if [[ -z "${FILTERED_BODY//[[:space:]]/}" ]]; then
                      echo "is-shame-worthy=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "is-shame-worthy=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  RAW_BODY: ${{ github.event.pull_request.body || '' }}

            - name: Skip shame comment with a read-only token
              if: ${{ steps.is-shame-worthy.outputs.is-shame-worthy == 'true' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
              run: echo "Skipping no-description PR comment for fork or Dependabot PRs because GitHub tokens are read-only."

            - name: Shame if PR has no description
              if: ${{ steps.is-shame-worthy.outputs.is-shame-worthy == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  SHAME_BODY="Hey @${{ github.actor }}! 👋\nThis pull request seems to contain no description. Please add useful context, rationale, and/or any other information that will help make sense of this change now and in the distant Mars-based future."
                  gh pr comment ${{ github.event.pull_request.number }} --body "$SHAME_BODY"
