name: Docusaurus compatibility

on:
    pull_request:
    merge_group:
        types: [checks_requested]
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    affected:
        permissions:
            contents: read
        uses: ./.github/workflows/check-affected.yml
        with:
            package-name: posthog-docusaurus
            additional-paths: |
                examples/example-docusaurus/
                examples/.pnpmfile.cjs
                packages/browser/
                packages/browser-common/
                packages/core/
                packages/types/
                packages/rrweb/
                tooling/rollup-utils/
                .github/workflows/docusaurus.yml
                .github/workflows/check-affected.yml
                .github/actions/is-affected/
                .github/actions/setup/

    compatibility:
        needs: affected
        if: needs.affected.outputs.is-affected == 'true'
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  build: false

            - name: Install Brave
              run: |
                  sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
                  sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
                  sudo apt-get update
                  sudo apt-get install -y brave-browser

            - name: Build the browser SDK and pack the plugin
              run: |
                  pnpm turbo run build --filter=posthog-js
                  pnpm package --filter=posthog-docusaurus
                  pnpm check:package-tarballs

            - name: Install the example
              working-directory: examples/example-docusaurus
              run: pnpm install

            - name: Test the installed plugin in Brave
              working-directory: examples/example-docusaurus
              env:
                  BRAVE_EXECUTABLE: /usr/bin/brave-browser
              run: pnpm test
