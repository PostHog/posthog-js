name: Browser SDK Compliance Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/browser/**'
      - 'packages/browser-common/**'
      - 'packages/core/**'
      - 'compliance/browser/**'
      - '.github/workflows/sdk-compliance-tests-browser.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/browser/**'
      - 'packages/browser-common/**'
      - 'packages/core/**'
      - 'compliance/browser/**'
      - '.github/workflows/sdk-compliance-tests-browser.yml'
  workflow_dispatch:

permissions: {}

jobs:
  test-browser-sdk:
    permissions:
      contents: read
      packages: read
      pull-requests: write
    uses: PostHog/posthog-sdk-test-harness/.github/workflows/test-sdk-action.yml@8ca75c478d8a1b7d5be3f9b82b1a744b8ee630c3
    with:
      adapter-dockerfile: compliance/browser/Dockerfile
      adapter-context: .
      test-harness-version: "0.10.0"
      sdk-type: client
      report-name: browser-sdk-compliance-report
