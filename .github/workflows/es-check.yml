name: ES5 support check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ssr:
    name: Build and check ES5/ES6 support
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          build: true

      - name: Run es-check to check if our ie11 bundle is ES5 compatible
        run: pnpm exec es-check es5 packages/browser/dist/array.full.es5.js

      - name: Run es-check to check if our main bundle is ES6 compatible
        run: pnpm exec es-check es6 packages/browser/dist/array.full.js
