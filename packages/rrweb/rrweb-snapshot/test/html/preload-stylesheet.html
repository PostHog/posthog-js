<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>preload stylesheet</title>
  <!-- The resource hint and the stylesheet point at the same url, as a page that
       preloads its own CSS emits them. Only the stylesheet applies any CSS. -->
  <link rel="preload" href="/css/style.css" as="style">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

</body>

</html>
