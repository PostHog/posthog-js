services:
  sdk-adapter:
    build:
      context: ../..
      dockerfile: compliance/node/Dockerfile
    expose:
      - "8080"
    # One codec per adapter process: gzip, deflate or zstd.
    environment:
      - COMPRESSION=${COMPRESSION:-gzip}
    networks:
      - test-network

  test-harness:
    image: ghcr.io/posthog/sdk-test-harness:1.25.0
    command: ["run", "--adapter-url", "http://sdk-adapter:8080", "--mock-url", "http://test-harness:8081", "--sdk-type", "server"]
    networks:
      - test-network
    depends_on:
      - sdk-adapter

networks:
  test-network:
    driver: bridge
